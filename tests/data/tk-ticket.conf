1369334468 'ticket-table' value '-- single value fields, most current only
CREATE TABLE ticket(
    -- Do not change any column that begins with tkt_
    tkt_id    INTEGER PRIMARY KEY,
    tkt_uuid  TEXT UNIQUE,
    tkt_mtime DATE,
    tkt_ctime DATE,

    -- Add as many fields as required below this line
    type            TEXT, -- Tracker
    status          TEXT, -- Primary workflow
    resolution      TEXT, -- Secondary workflow
    subsystem       TEXT, -- Functional module
    priority        TEXT, 
    severity        TEXT, 
    foundin         TEXT, -- Version issue was found in
    private_contact TEXT, 
    title           TEXT, -- summary description
    comment         TEXT, -- description
    cmimetype       TEXT, -- format of description
    submitter       TEXT, -- ticket creator
    assignee        TEXT, -- developer currently handling the ticket
    closer          TEXT, -- developer who closed the ticket, if closed
    closedate       TEXT, -- when the ticket got closed
    is_private	    INTEGER
);
-- listified ticket fields
CREATE TABLE ticketchng(
    -- Do not change any column that begins with tkt_
    tkt_id    INTEGER REFERENCES ticket,
    tkt_rid   INTEGER REFERENCES blob,
    tkt_mtime DATE,
   			 			 			 
    -- Add as many fields as required below this line
    login    TEXT,
    username TEXT,
    mimetype TEXT,
    icomment TEXT
);
CREATE INDEX ticketchng_idx1 ON ticketchng(tkt_id, tkt_mtime);'
