1369334468 'ticket-newpage' value '<th1>
if {![info exists mutype]} {set mutype {[links only]}}
if {[info exists submit]} {
    set status     Open
    set resolution None
    set priority   {5 Medium}
    set assignee   nobody
    set closer     nobody
    set is_private 0
    set submitter  $login

    if {$mutype eq "HTML"} {
	set cmimetype "text/html"
    } elseif {$mutype eq "Wiki"} {
	set cmimetype "text/x-fossil-wiki"
    } else {
	set cmimetype "text/plain"
    }
    submit_ticket
    set preview 1
}
</th1>
<h1 style="text-align: center;">Enter A New Ticket</h1>

<table cellpadding="5">
<tr>
    <td align="right">Summary:</td>
    <td align="left" ><input type="text" name="title" size="60" value="$<title>"/></td>
    <td align="left" >Enter a one-line summary of the ticket.</td>
</tr>
<tr>
    <td align="right">Type:</td>
    <td align="left" ><th1>combobox type $type_choices 1</th1></td>
    <td align="left" >What type of ticket is this?</td>
</tr>
<tr>
    <td align="right">Version:</td>
    <td align="left" ><input type="text" name="foundin" size="20" value="$<foundin>" /></td>
    <td align="left" >In what version or build number do you observe the
                      problem?</td>
</tr>
<tr>
    <td align="right">Category:</td>
    <td align="left" ><th1>combobox subsystem $subsystem_choices 1</th1></td>
    <td align="left" >Roughly where do you see the problem?</td>
</tr>
<tr>
    <td align="right">Severity:</td>
    <td align="left" ><th1>combobox severity $severity_choices 1</th1></td>
    <td align="left" >How debilitating is the problem?  How badly does the
                      problem affect the operation of the product?</td>
</tr>
<tr>
    <td align="right">EMail:</td>
    <td align="left" ><input type="text" name="private_contact" value="$<private_contact>" size="30" /></td>
    <td align="left" ><u>Not publicly visible</u> Used by developers to
                      contact you with questions.</td>
</tr>

<tr><td colspan="3">
Enter a detailed description of the problem.
For code defects, be sure to provide details
on exactly how the problem can be reproduced.
Provide as much detail as possible.
<br/>Format:
<th1>combobox mutype {{Plain Text} HTML Wiki} 1</th1>
<br/>
<th1>set nline [linecount $comment 50 10]</th1>
<textarea name="comment" cols="80" rows="$nline"
wrap="virtual" class="wikiedit">$<comment></textarea><br/>
</td></tr>

<th1>enable_output [info exists preview]</th1>
<tr><td colspan="3">
Description Preview:<br /><hr />
<th1>
if {$mutype eq "Wiki"} {
    wiki $comment
} elseif {$mutype eq "Plain Text"} {
    set r [randhex]
    wiki "<verbatim-$r links>[string trimright $comment]\n</verbatim-$r>"
} else { # HTML
    wiki "<nowiki>$comment\n</nowiki>"
}
</th1>
<hr /></td></tr>
<th1>enable_output 1</th1>

<tr>
    <td>&nbsp;</td>
    <td align="left"><input type="submit" name="preview" value="Preview" /></td>
    <td align="left">See how the description will appear after formatting.</td>
</tr>

<th1>enable_output [info exists preview]</th1>
<tr>
    <td>&nbsp;</td>
    <td align="left"><input type="submit" name="submit" value="Submit" /></td>
    <td align="left">After filling in the information above, press this button
                     to create the new ticket</td>
</tr>
<th1>enable_output 1</th1>

<tr>
    <td>&nbsp;</td>
    <td align="left"><input type="submit" name="cancel" value="Cancel" /></td>
    <td>Abandon and forget this ticket</td>
</tr>
</table>'
