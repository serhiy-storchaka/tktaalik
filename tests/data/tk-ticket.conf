1440624622 'Your tickets (submitted by, or assigned to, or commented by you)' owner 'fvogel' cols '#ffffff Priority:
#ff442d 9 (Blocker)
#eb974a 8
#ffe054 7 (High)
#cae054 6
#54e054 5 (Normal)
#20f5ba 4
#20d5f0 3 (Low)
#6ca1ff 2
#a394c6 1 (Zero)
#c8c8c8 Closed' sqlcode 'SELECT
  /* Background color selection for each line is based on priority,
     except when the ticket is closed, in which case it is grey.
   */
  CASE status
    WHEN ''Closed'' THEN ''#c8c8c8''
  ELSE
    CASE priority
      WHEN ''9 Immediate'' THEN ''#ff442d''
      WHEN 9 THEN ''#ff442d''
      WHEN 8 THEN ''#eb974a''
      WHEN ''7 High'' THEN ''#ffe054''
      WHEN 7 THEN ''#ffe054''
      WHEN 6 THEN ''#cae054''
      WHEN 5 THEN ''#54e054''
      WHEN ''5 Medium'' THEN ''#54e054''
      WHEN 4 THEN ''#20f5ba''
      WHEN 3 THEN ''#20d5f0''
      WHEN ''3 Low'' THEN ''#20d5f0''
      WHEN 2 THEN ''#6ca1ff''
      WHEN 1 THEN ''#a394c6''
      WHEN ''1 Zero'' THEN ''#a394c6''
    ELSE ''#ffffff''
    END
  END                              AS ''bgcolor'',
  rtrim(substr(tkt_uuid,1,10),''f'') AS ''#'',
  type                             AS ''Type'',
  status                           AS ''Status'',
  priority                         AS ''Priority'',
  datetime(ticket.tkt_mtime)       AS ''Last Changed'',
  subsystem                        AS ''Subsystem'',
  title                            AS ''Summary'',
  assignee                         AS ''Assigned To''
FROM ticket

/* The ticketchng table contains the comments.
 */
INNER JOIN ticketchng
ON ticket.tkt_id = ticketchng.tkt_id

/* Assignee and submitter shall be exactly $login,
   but the login field of comments shall simply _contain_ $login.
   This is intentional.
 */
WHERE ((assignee = $login OR submitter = $login) OR login LIKE ''%''||$login||''%'')

/* Without grouping, tickets commented several times by $login
   would show up several times. Prevent this from happening.
 */
GROUP BY ticket.tkt_id

/* Open tickets shown before Closed ones (Pending and Deleted show up
   as well - I don''t really care).
   Order Open tickets by priority and then by most recent ticket
   modification time.
   Order closed tickets by most recent ticket modification time.
 */
ORDER BY status DESC, (CASE status WHEN ''Closed'' THEN status ELSE priority END) DESC, ticket.tkt_mtime DESC

/*
   SUMMARY:
     Select tickets that $login either submitted, or is the assignee to,
     or commented at least once in the ticket history.
     Show them with a background color related to status and priority.
     Order them by open status first, or by modification time for
     closed ones.
 */' jx '{}'
config /reportfmt 2246
