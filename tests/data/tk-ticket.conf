1471820579 'All Tickets' owner 'ticket-master' cols '#ffffff Key:
#f2dcdc Open
#bde5d6 Deleted
#cacae5 Pending
#c8c8c8 Closed' sqlcode 'SELECT
CASE WHEN status=''Open''    THEN ''#f2dcdc''
     WHEN status=''Deleted'' THEN ''#bde5d6''
     WHEN status=''Pending'' THEN ''#cacae5''
